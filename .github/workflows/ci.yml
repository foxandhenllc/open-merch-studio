name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_merch_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_merch_studio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_merch_studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run type-check
      - name: Run fixture and unit tests without a configured database
        run: DATABASE_URL= npm test
      - name: Run serialized PostgreSQL recovery integration test
        run: node --import tsx --test --test-concurrency=1 backend/src/tests/database-recovery.integration.test.ts
      - run: npm run build
