name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: open_merch_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d open_merch_studio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/open_merch_studio
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Use the repository npm version
        run: npm install --global npm@10.9.2
      - run: npm ci --no-audit
      - name: Reject browser-bundled credential variables
        run: |
          if git grep -nE 'VITE_[A-Z0-9_]*(SECRET|TOKEN|PASSWORD|PRIVATE|ACCESS_CODE)' -- frontend .env.example; then
            echo 'VITE_* values are public browser configuration and cannot contain credentials.' >&2
            exit 1
          fi
      - name: Audit production dependencies for high-severity vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Prepare the Supabase Storage contract in plain PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f backend/prisma/ci-storage-bootstrap.sql
      - run: npx prisma migrate deploy --schema backend/prisma/schema.prisma
      - run: npm run lint
      - run: npm run type-check
      - name: Run fixture and unit tests without a configured database
        run: DATABASE_URL= npm test
      - name: Run the fixture end-to-end smoke path
        run: DATABASE_URL= npm run smoke:fixture
      - name: Run serialized PostgreSQL recovery integration test
        run: node --import tsx --test --test-concurrency=1 backend/src/tests/database-recovery.integration.test.ts
      - run: npm run build
      - name: Install the browser used by responsive smoke coverage
        run: npx playwright install --with-deps chromium
      - name: Run responsive and first-visitor browser smoke coverage
        run: npm run test:browser
