name: Production monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Exercise incident open and recovery handling without changing production.
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: open-merch-studio-production-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Probe production
        id: monitor
        continue-on-error: true
        shell: bash
        env:
          OMS_EXPECTED_CHECKOUT_CAPABILITY: ${{ inputs.simulate_failure && 'offline' || 'live' }}
        run: |
          set -o pipefail
          node scripts/production-monitor.mjs 2>&1 | tee production-monitor-output.txt
      - name: Open or update production incident
        if: steps.monitor.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const title = '[Production monitor] Open Merch Studio unhealthy';
            const output = fs.readFileSync('production-monitor-output.txt', 'utf8').slice(-12000);
            const body = [
              'The automated production monitor failed.',
              '',
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```text',
              output,
              '```',
            ].join('\n');
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
      - name: Close recovered production incident
        if: steps.monitor.outcome == 'success'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[Production monitor] Open Merch Studio unhealthy';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Production recovered in workflow run ${context.runId}.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
              });
            }
      - name: Fail after incident handling
        if: steps.monitor.outcome == 'failure'
        run: exit 1
